}
const validName=s=>{s=String(s||'').trim();return s.length>=2&&/\p{L}/u.test(s)&&!/^(.)\1+$/u.test(s.replace(/\s/g,''))};
const weakPass=p=>/^(.)\1+$/.test(p)||['1234','12345','123456','1234567','12345678','4321','0000','password','qwerty','1111'].includes(p.toLowerCase());
function updLiCC(){$('#liCC').hidden=true}
$('#liId').addEventListener('input',updLiCC);

/* ---------- Accounts on this phone ---------- */
function genSerial(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';
  try{const r=crypto.getRandomValues(new Uint8Array(5));r.forEach(x=>s+=A[x%A.length])}catch(e){for(let i=0;i<5;i++)s+=A[Math.floor(Math.random()*A.length)]}
  return 'M-'+s;
}
function ensureSerial(){if((settings.registered||settings.shopName)&&!settings.serial){settings.serial=genSerial();saveSettings()}}
const myCode=()=>settings.serial||shortCode(myId);
let accounts=lsGet('shop.accounts',[]);
function saveAccounts(){lsSet('shop.accounts',accounts);if(base&&db)queue(base+'/accounts',{items:accounts})}
function syncAccount(){
  if(!settings.shopName&&!settings.registered)return;
  const v={id:ACCT,shop:settings.shopName||'',owner:settings.ownerName||'',serial:settings.serial||'',phone:settings.phone||'',email:settings.email||'',pinHash:settings.pinHash||''};
  const e=accounts.find(a=>a.id===ACCT);
  if(!e){accounts.push(v);saveAccounts()}
  else if(['shop','owner','serial','phone','email','pinHash'].some(k=>(e[k]||'')!==(v[k]||''))){Object.assign(e,v);saveAccounts()}
}
function switchTo(id){try{localStorage.setItem('shop.acct',id);localStorage.setItem('shop.loggedOut','true')}catch(e){}location.reload()}
function newAccount(){try{localStorage.setItem('shop.acct','a'+uid());localStorage.removeItem('shop.loggedOut')}catch(e){}location.reload()}
function renderAcctSwitch(){
  if(!$('#acctSwitch'))return;
  const others=accounts.filter(a=>a.id!==ACCT);
  $('#acctSwitch').innerHTML=others.length?`<div class="muted" style="margin:0 0 8px">${t('switchAcct')}</div><div class="chips" style="justify-content:center">${others.map(a=>`<button type="button" data-acct="${esc(a.id)}">${esc(a.shop||a.owner||t('noName'))}</button>`).join('')}</div>`:'';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-acct]');if(b)switchTo(b.dataset.acct)});

/* ---------- Account settings + lock ---------- */
let settings=lsGet('shop.settings',{});
if(settings.lang&&T[settings.lang])lang=settings.lang;
let unlocked=false;
let loggedOut=!!lsGet('shop.loggedOut',false);
function saveSettings(){lsSet('shop.settings',settings);if(base)queue(base+'/settings',settings);syncAccount()}
async function hashPin(p){
  const s='shopapp:'+p;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'd'+(h>>>0).toString(16)}
}
const PALS={purple:['#6D3FD6','#C9971F'],blue:['#2347A8','#7C9BFF'],navy:['#1E3A6E','#E8B84A'],black:['#1C1C1C','#E8C468'],emerald:['#0E8A63','#34D399'],teal:['#0E7C86','#2DD4BF'],sunset:['#E8590C','#F2B33D'],rose:['#C2255C','#F472B6']};
function renderPal(){$('#palRow').innerHTML=Object.entries(PALS).map(([k,c])=>`<button class="swatch" data-pal-pick="${k}" aria-pressed="${(settings.palette||'purple')===k}" aria-label="${k}" style="background:linear-gradient(135deg,${c[0]} 50%,${c[1]} 50%)"></button>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pal-pick]');if(!b)return;settings.palette=b.dataset.palPick;saveSettings();applyTheme();renderPal();haptic(1)});
function applyTheme(){window.__cur=settings.currency||'USD';document.documentElement.setAttribute('data-pal',settings.palette||'purple');const th=settings.theme||'auto';if(th==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',th)}
let authMode='login',authForced=false,pendingDone=null,otherMode=false,whoSel='owner';
function checkLock(){
  if(authForced)return;
  const reg=!!(settings.registered||settings.shopName);
  const on=reg&&!!settings.pinHash&&(settings.pinEnabled!==false||loggedOut)&&!unlocked;
  $('#lock').hidden=!on;
  if(on){authMode='login';otherMode=false;{const m=member();whoSel=m?m.id:'owner'}{const sp=splitPhone(settings.phone);$('#liCC').value=sp.cc;$('#liId').value=settings.phone?sp.nat:(settings.email||'');updLiCC()}$('#lockInput').value='';renderAuth()}
}
function openAuth(mode){authForced=true;authMode=mode;$('#lock').hidden=false;renderAuth()}
function renderAuth(){
  $$('[data-auth]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.auth===authMode));
  $('#authLogin').hidden=authMode!=='login';$('#authReg').hidden=authMode!=='register';
  const reg=!!(settings.registered||settings.shopName);
  const pick=authMode==='login'&&!sbMode&&reg;
  $('.authtabs').hidden=!sbMode;
  $('#acctChips').hidden=true;
  $('#whoGrid').hidden=!pick;$('#liIdField').hidden=pick;
  $('#liCC').hidden=true;$('#liId').type='email';$('#liId').placeholder='name@gmail.com';$('label[for="liId"]').textContent=t('email');
  $('#otherAcct').hidden=sbMode;$('#otherAcct').textContent=t('signOutAcct');
  $('#authTitle').textContent=sbMode?(authMode==='login'?t('loginTitle'):t('regTitle')):(settings.ownerName?t('welcomeBack').replace('{n}',settings.ownerName):t('loginTitle'));
  $('#authSub').textContent=sbMode?(authMode==='login'?t('loginSubEmail'):t('regLead')):t('whoUsing');
  if(pick){
    const team=settings.team||[];
    if(whoSel!=='owner'&&!team.some(m=>m.id===whoSel))whoSel='owner';
    const people=[{id:'owner',name:settings.ownerName||settings.shopName||t('owner'),role:t('owner')},...team.map(m=>({id:m.id,name:m.name,role:t('team'),staff:1}))];
    $('#whoGrid').innerHTML=people.map(x=>`<button type="button" class="who${x.staff?' staff':''}" data-who="${esc(x.id)}" aria-pressed="${x.id===whoSel}"><span class="av">${esc((x.name||'?').trim().charAt(0).toUpperCase())}</span><b>${esc(x.name)}</b><small>${x.role}</small></button>`).join('');
    const sel=people.find(x=>x.id===whoSel);
    $('#passLbl').textContent=t('passFor').replace('{n}',sel?sel.name:'');
  }else $('#passLbl').textContent=t('lockH');
  $('#lockErr').textContent='';$('#lockErr').classList.remove('info');
  setTimeout(()=>{const f=authMode==='login'?(pick||$('#liId').value?$('#lockInput'):$('#liId')):$('#aShop');f&&f.focus()},60);
}
const digits=s=>String(s||'').replace(/\D/g,'');
function matchesId(phone,email,q){
  q=String(q||'').trim();if(!q)return false;
  if(q.includes('@'))return !!email&&email.trim().toLowerCase()===q.toLowerCase();
  const a=digits(phone),b=digits(q);if(a.length<6||b.length<6)return false;
  return a.slice(-9)===b.slice(-9);
}
function authErr(msg){beep(false);$('#lockErr').textContent=msg}
function finishLogin(){
  unlocked=true;loggedOut=false;authForced=false;
  try{localStorage.removeItem('shop.loggedOut')}catch(e){}
  $('#lock').hidden=true;$('#onboard').hidden=true;renderSub();haptic(1);
}
async function doLogin(){
  if(sbMode){
    const email=$('#liId').value.trim().toLowerCase(),pw=$('#lockInput').value;
    if(!email||!pw){authErr(t('fillBoth'));return}
    if(!SB){authErr(t('needClaude'));return}
    $('#lockGo').disabled=true;
    const {error}=await SB.auth.signInWithPassword({email,password:pw});
    $('#lockGo').disabled=false;
    if(error){authErr(/confirm/i.test(error.message)?t('confirmFirst'):t('badLogin'));return}
    try{localStorage.setItem('shop.unlockOnce','');localStorage.setItem('shop.pwh',await hashPin(pw));localStorage.removeItem('shop.loggedOut')}catch(e){}
    location.reload();return;
  }
  const pw=$('#lockInput').value;if(!pw){authErr(t('enterPin'));return}
  const hsh=await hashPin(pw);
  if(whoSel==='owner'){if(!settings.pinHash||hsh===settings.pinHash){setMember(null);finishLogin()}else{authErr(t('pinWrong'));$('#lockInput').value=''}}
  else{const mb=(settings.team||[]).find(m=>m.id===whoSel);if(mb&&mb.pinHash===hsh){setMember(mb.id);finishLogin()}else{authErr(t('pinWrong'));$('#lockInput').value=''}}
}
function showDone(owner){
  $('#onbDoneTitle').textContent=t('doneTitle').replace('{n}',owner);
  $('#onbCodeBox').hidden=false;$('#onbCode').textContent=myCode();
  onbStep(3);$('#onboard').hidden=false;beep(true);
}
async function doRegister(){
  const shop=$('#aShop').value.trim(),owner=$('#aOwner').value.trim(),phoneRaw=$('#aPhone').value.trim(),email=$('#aEmail').value.trim().toLowerCase();
  const p1=$('#aPass').value,p2=$('#aPass2').value;
  if(!shop||!owner||!phoneRaw||!email){authErr(t('regReq'));return}
  if(!validName(shop)||!validName(owner)){authErr(t('badName'));return}
  const phone=parsePhone(phoneRaw,$('#aCC').value);
  if(!phone){authErr(t('badPhone'));return}
  if(!validEmail(email)){authErr(t('badEmail'));return}
  if(p1.length<6){authErr(t('pass6'));return}
  if(weakPass(p1)){authErr(t('weakPass'));return}
  if(p1!==p2){authErr(t('pinMismatch'));return}
  if(!SB){authErr(t('needClaude'));return}
  $('#regGo').disabled=true;
  const {data,error}=await SB.auth.signUp({email,password:p1,options:{data:{shop_name:shop,owner_name:owner,phone,serial:genSerial()},emailRedirectTo:location.origin+location.pathname}});
  $('#regGo').disabled=false;
  if(error){authErr(/registered|exists/i.test(error.message)?t('alreadyReg'):error.message);return}
  try{localStorage.setItem('shop.pwh',await hashPin(p1))}catch(e){}
  if(data&&data.session){try{localStorage.setItem('shop.unlockOnce','');localStorage.setItem('shop.justReg','1')}catch(e){}location.reload();return}
  authMode='login';renderAuth();$('#liId').value=email;
  $('#lockErr').textContent=t('confirmEmail');$('#lockErr').classList.add('info');
}
$$('[data-auth]').forEach(b=>b.onclick=()=>{authMode=b.dataset.auth;renderAuth()});
document.addEventListener('click',e=>{const w=e.target.closest('[data-who]');if(!w)return;whoSel=w.dataset.who;$('#lockInput').value='';renderAuth();haptic(1);setTimeout(()=>$('#lockInput').focus(),60)});
$('#otherAcct').onclick=()=>{signOutAll()};
$('#regGo').onclick=doRegister;
$('#aPass2').addEventListener('keydown',e=>{if(e.key==='Enter')doRegister()});
$('#liId').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lockInput').focus()});
function renderSettings(){
  $('#appTitle').textContent=settings.shopName||t('app');
  $('#langSel').value=lang;$('#themeSel').value=settings.theme||'auto';$('#curSel').value=settings.currency||'USD';renderPal();applyCashier();applyMember();
  $('#secProfileMeta').textContent=settings.shopName||'';$('#secLockMeta').textContent=(settings.pinHash&&settings.pinEnabled!==false)?'🔒':'🔓';
  $('#serialCard').hidden=!settings.serial;$('#serialNo').textContent=settings.serial||'';
  $('#sShop').value=settings.shopName||'';$('#sOwner').value=settings.ownerName||'';
  {const sp=splitPhone(settings.phone);$('#sCC').value=sp.cc;$('#sPhone').value=sp.nat}$('#sEmail').value=settings.email||'';
  $$('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  $$('[data-theme-btn]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeBtn===(settings.theme||'auto')));
  const has=!!settings.pinHash;
  const en=has&&settings.pinEnabled!==false;
  $('#pinToggle').checked=en;
  $('#pinStatus').textContent=en?t('lockOn'):(has?t('lockPaused'):t('lockOff'));
  $('#curPinField').hidden=!has;$('#lockNow').hidden=!en;
  $('#pinSave').textContent=has?t('changePin'):t('setPin');
  ['#pinCur','#pinNew','#pinNew2'].forEach(s=>$(s).value='');
}
$('#lockGo').onclick=doLogin;
$('#lockInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lockGo').click()});
$('#sSave').onclick=()=>{
  const shop=$('#sShop').value.trim(),owner=$('#sOwner').value.trim();
  if(!validName(shop)||!validName(owner)){toast(t('badName'),'err');return}
  const ph=parsePhone($('#sPhone').value,$('#sCC').value);
  if(!ph){toast(t('badPhone'),'err');return}
  const em=$('#sEmail').value.trim().toLowerCase();
  if(em&&!validEmail(em)){toast(t('badEmail'),'err');return}
  const taken=accounts.some(a=>a.id!==ACCT&&(matchesId(a.phone,a.email,ph)||(em&&matchesId(a.phone,a.email,em))));
  if(taken){toast(t('alreadyReg'),'err');return}
  Object.assign(settings,{shopName:shop,ownerName:owner,phone:ph,email:em});
  saveSettings();renderSettings();toast(t('saved'),'ok');
};
$$('[data-theme-btn]').forEach(b=>b.onclick=()=>{settings.theme=b.dataset.themeBtn;saveSettings();applyTheme();renderSettings()});
$('#pinSave').onclick=async()=>{
  const a=$('#pinNew').value,a2=$('#pinNew2').value;
  if(settings.pinHash&&await hashPin($('#pinCur').value)!==settings.pinHash){toast(t('pinWrong'),'err');return}
  if(a.length<4){toast(t('pinShort'),'err');return}
  if(a!==a2){toast(t('pinMismatch'),'err');return}
  settings.pinHash=await hashPin(a);settings.pinEnabled=true;unlocked=true;saveSettings();renderSettings();toast(t('pinSaved'),'ok');
};
$('#pinToggle').addEventListener('change',async e=>{
  const want=e.target.checked;
  if(want){
    if(!settings.pinHash){e.target.checked=false;toast(t('setFirst'),'err');($('#secLock').open=true,$('#pinNew').focus());return}
    settings.pinEnabled=true;unlocked=true;saveSettings();renderSettings();toast(t('pinOnMsg'),'ok');
  }else{
    const cur=$('#pinCur').value;
    if(!cur){e.target.checked=true;toast(t('curFirst'),'err');($('#secLock').open=true,$('#pinCur').focus());return}
    if(await hashPin(cur)!==settings.pinHash){e.target.checked=true;toast(t('pinWrong'),'err');return}
    settings.pinEnabled=false;saveSettings();renderSettings();toast(t('pinOffMsg'),'ok');
  }
});
$('#lockNow').onclick=()=>{unlocked=false;checkLock()};
$('#langSel').addEventListener('change',e=>{lang=e.target.value;settings.lang=lang;try{localStorage.setItem('shop.lang',lang)}catch(_){}saveSettings();applyLang()});
$('#themeSel').addEventListener('change',e=>{settings.theme=e.target.value;saveSettings();applyTheme()});
$('#curSel').addEventListener('change',e=>{settings.currency=e.target.value;saveSettings();applyTheme();applyLang();toast(t('curNote'),'ok')});
$('#logoutBtn').onclick=()=>{
  const b=$('#logoutBtn');
  if(!armed(b.querySelector('span')))return;
  signOutAll();
};

try{
  const u=localStorage.getItem('shop.unlockOnce');
  if(u!==null){localStorage.removeItem('shop.unlockOnce');if(u===ACCT){unlocked=true;loggedOut=false;localStorage.removeItem('shop.loggedOut')}}
  const pr=localStorage.getItem('shop.pendingReg');
  if(pr&&!settings.registered&&!settings.shopName){localStorage.removeItem('shop.pendingReg');Object.assign(settings,JSON.parse(pr));settings.serial=settings.serial||genSerial();saveSettings();pendingDone=settings.ownerName||' '}
}catch(e){}
applyTheme();
ensureSerial();
syncAccount();
applyLang();
checkLock();
checkOnboard();
if(pendingDone)showDone(pendingDone);
restoreDraft();
initDb();
</script>
</body>
