<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ژمێریارا دوکانێ</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --ink:#1C2433; --muted:#5F6876; --line:#DCDFE3;
  --blue:#2347A8; --blue-ink:#FFFFFF; --tan:#B98A4E; --tan-soft:#F1E6D6;
  --green:#1F7A4D; --red:#B3261E; --red-soft:#FBE9E7;
  --font:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151B; --surface:#1B2029; --ink:#E8EAEE; --muted:#9AA3B2; --line:#2C3340;
    --blue:#7C9BFF; --blue-ink:#0E1424; --tan:#D3A86A; --tan-soft:#2E2618;
    --green:#5CC08A; --red:#FF8A80; --red-soft:#3A1E1C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1B2029; --ink:#E8EAEE; --muted:#9AA3B2; --line:#2C3340;
  --blue:#7C9BFF; --blue-ink:#0E1424; --tan:#D3A86A; --tan-soft:#2E2618;
  --green:#5CC08A; --red:#FF8A80; --red-soft:#3A1E1C; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100%}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 60% at 100% 0%,color-mix(in srgb,var(--blue) 24%,transparent),transparent 60%),radial-gradient(90% 55% at 0% 100%,color-mix(in srgb,var(--tan) 26%,transparent),transparent 60%),radial-gradient(60% 40% at 0% 30%,color-mix(in srgb,var(--green) 10%,transparent),transparent 70%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;font-weight:700;margin:0;flex:1}
header h1{max-width:560px;margin:0 auto}
.sync{font-size:12px;color:var(--muted);max-width:560px;margin:0 auto;padding:0 16px}
section[hidden]{display:none}

/* Sell */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 0 20px}
.scanbtn{width:200px;height:200px;border-radius:50%;border:0;background:var(--blue);color:var(--blue-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;box-shadow:0 0 0 10px color-mix(in srgb,var(--blue) 14%,transparent)}
.scanbtn:active{transform:scale(.97)}
.bars{display:flex;gap:3px;height:46px;align-items:stretch}
.bars i{display:block;background:currentColor;border-radius:1px}
.hero p{color:var(--muted);margin:18px 0 0;max-width:30ch}
.row{display:flex;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:14px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=password],input[type=email],input[type=tel],input[type=date]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:500;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn.blue{background:var(--blue);color:var(--blue-ink)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid var(--red)}
.btn.wide{width:100%}
h2{font-size:17px;margin:24px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.quick{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:start;width:100%}
.quick small{display:block;color:var(--muted);font-size:13px}
.quick .price{font-weight:700}
.empty{color:var(--muted);padding:16px 0}

/* Stock */
.toolbar{display:flex;gap:8px;margin:8px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.low{border-color:var(--red)}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font-size:17px}
.card .code{font-size:13px;color:var(--muted)}
.qty{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:6px;background:var(--tan-soft);color:var(--ink);font-weight:500;border-inline-start:4px solid var(--tan)}
.card.low .qty{background:var(--red-soft);border-color:var(--red)}
.badge{font-size:12px;color:var(--red);font-weight:700}
.card-actions{display:flex;gap:8px;margin-top:12px}
.card-actions .btn{padding:8px 12px;font-size:14px}

/* Accounts */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin:8px 0 16px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.profit{padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.profit .lbl{color:var(--muted);font-size:14px}
.profit .big{font-size:40px;font-weight:700;color:var(--green);line-height:1.2}
.profit .big.neg{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .v{font-weight:700;font-size:16px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.pos{color:var(--green)}

/* Nav */
nav{position:fixed;bottom:0;inset-inline:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
nav button[aria-current="page"]{color:var(--blue);font-weight:700}
nav svg{width:24px;height:24px}

/* Sheets */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.calc{display:flex;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px;margin-bottom:6px}
.sheet-actions{display:flex;gap:8px;margin-top:14px}
.sheet-actions .btn{flex:1}
#scanOverlay{z-index:40}
#scanOverlay .sheet{background:#000;color:#fff}
#reader{width:100%;min-height:240px;border-radius:12px;overflow:hidden;background:#111}
#reader video{width:100%!important;height:auto!important;object-fit:cover}
#reader img{display:none}
.scanmsg{margin:12px 0;font-size:15px;color:#ddd;min-height:1.5em}
.scanmsg.err{color:#FFB4AB}
#scanOverlay input{background:#1b1b1b;border-color:#333;color:#fff}

/* Quantity */
.qtywrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:18px}
.qtywrap .lbl{font-size:14px;color:var(--muted)}
.qtybox{display:flex;align-items:center;justify-content:center;gap:12px}
.qtybox button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:21px;font-weight:700;line-height:1}
.qtybox button:active{transform:scale(.94)}
.qtybox input{width:64px;text-align:center;font-size:20px;font-weight:700;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
#scanOverlay .qtywrap{margin:0 0 12px}
#scanOverlay .qtywrap .lbl{color:#bbb}
#scanOverlay .qtybox button,#scanOverlay .qtybox input{background:#1b1b1b;color:#fff;border-color:#333}

/* Switch */
.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-weight:700}
.switch{position:relative;width:54px;height:32px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(22px)}
.switch input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}

/* Orders + receipt */
.order{margin-top:22px}
.order-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.order-head h3{margin:0;font-size:17px}
.order-total{font-size:22px;font-weight:700}
.oline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.oline small{color:var(--muted)}
.order .btn{margin-top:12px}
.order .btn:disabled{opacity:.45}
.ocard{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;text-align:start}
.ocard small{display:block;color:var(--muted);font-size:13px}
.ocard .num{font-weight:700}
.rc{background:#fff;color:#1C2433;border-radius:12px;padding:18px 16px;font-size:15px}
.rc-shop{font-size:20px;font-weight:700;text-align:center}
.rc-sub{text-align:center;color:#5F6876;font-size:13px}
.rc-meta{display:flex;justify-content:space-between;margin:14px 0 8px;padding-bottom:8px;border-bottom:2px dashed #C9CDD3;font-size:14px}
.rc table{font-size:14px}
.rc th,.rc td{border-bottom:1px dashed #DCDFE3;padding:8px 4px;white-space:normal}
.rc th{color:#5F6876}
.rc-total{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:2px solid #1C2433;font-size:20px;font-weight:700}

/* Confirm */
.confirm{text-align:center}
.confirm h2{font-size:18px}
.confirm-name{font-size:22px;font-weight:700}
.confirm-sum{color:var(--muted);margin-top:4px;font-size:16px}
.confirm .sheet-actions .btn{padding:14px;font-size:17px}

/* Date range */
.range{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-4px 0 10px}
.range input{min-height:46px}

/* Subscription + admin */
textarea{width:100%;min-height:90px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;color:inherit;resize:vertical}
.paywall{z-index:45}
.pwcode{font-size:28px;font-weight:700;letter-spacing:2px}
.subbanner{width:calc(100% - 32px);max-width:528px;margin:8px auto 0;padding:10px 14px;border-radius:10px;background:var(--red-soft);color:var(--red);font-weight:500;font-size:14px}
.subcard{margin-top:12px}
.subcard .lbl{color:var(--muted);font-size:14px}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-active{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.st-expired{background:var(--red-soft);color:var(--red)}
.st-new{background:var(--tan-soft);color:var(--tan)}
.card.mk.expired{border-color:var(--red)}
.card-actions.wrap2{flex-wrap:wrap}
.admstats{grid-template-columns:repeat(2,1fr)}

/* Debts */
.debt{color:var(--red);font-weight:700}
.paidup{color:var(--green);font-weight:500;font-size:14px}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.linkbtn{border:0;background:none;color:var(--blue);text-decoration:underline;padding:0;font:inherit}
.debtsum{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* Expenses */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.profit .sub{color:var(--muted);font-size:14px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 16px}

/* Welcome + register */
.onb{position:fixed;inset:0;z-index:48;overflow-y:auto;display:flex;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 55% at 100% 0%,color-mix(in srgb,var(--blue) 38%,transparent),transparent 62%),radial-gradient(100% 50% at 0% 100%,color-mix(in srgb,var(--tan) 32%,transparent),transparent 60%),var(--bg)}
.onb-in{width:100%;max-width:420px;display:flex;flex-direction:column;min-height:100%}
.onb-step{display:flex;flex-direction:column;flex:1}
.logo{width:108px;height:108px;border-radius:30px;background:var(--blue);color:var(--blue-ink);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin:26px auto 20px;box-shadow:0 18px 44px color-mix(in srgb,var(--blue) 45%,transparent);flex:none}
.logo .bars{height:52px}
.logo.sm{width:72px;height:72px;border-radius:22px;margin:14px auto 14px}
.logo.sm .bars{height:34px;gap:2px}
.logo::after{content:"";position:absolute;left:12px;right:12px;height:3px;border-radius:2px;background:#FF5A4E;box-shadow:0 0 14px 3px rgba(255,90,78,.8);top:18%;animation:laser 1.6s ease-in-out infinite alternate}
@keyframes laser{to{top:80%}}
.onb h1{font-size:27px;line-height:1.3;text-align:center;margin:0 0 8px}
.onb .lead{text-align:center;color:var(--muted);margin:0 0 22px}
.feat{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;opacity:0;transform:translateY(14px);animation:rise .55s ease forwards}
.feat:nth-child(2){animation-delay:.14s}.feat:nth-child(3){animation-delay:.28s}
@keyframes rise{to{opacity:1;transform:none}}
.feat .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.feat .ic svg{width:24px;height:24px}
.feat b{display:block;font-size:16px}.feat small{color:var(--muted);font-size:14px}
.onb .spacer{flex:1;min-height:16px}
.btn.big{width:100%;padding:16px;font-size:18px;font-weight:700;border-radius:14px}
.onb-langs{display:flex;justify-content:center;gap:6px}
.onb-langs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:14px}
.onb-langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{display:flex;gap:6px;justify-content:center;margin:16px 0}
.steps i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .3s}
.steps i.on{width:26px;background:var(--blue)}
.okmark{width:100px;height:100px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;margin:56px auto 22px;box-shadow:0 16px 40px color-mix(in srgb,var(--green) 45%,transparent);animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.okmark svg{width:50px;height:50px}
.lockhello{font-size:22px;margin:0 0 4px}

/* Account switch */
.acct-switch{margin-top:20px}

/* Plans */
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 4px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted);font-weight:400}
.plan b{display:block;font-size:16px;color:var(--ink)}

/* Market sheet */
.plangrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plangrid .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px}
.plangrid b{font-size:18px}

/* Settings + lock */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.muted{color:var(--muted);font-size:14px;margin:0 0 10px}
.lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 60% at 100% 0%,color-mix(in srgb,var(--blue) 32%,transparent),transparent 60%),radial-gradient(90% 55% at 0% 100%,color-mix(in srgb,var(--tan) 30%,transparent),transparent 60%),var(--bg)}
.lockbox{width:100%;max-width:320px;text-align:center}
.lockicon{font-size:44px}
.lockbox h2{margin:10px 0 16px}
.lockbox input{text-align:center;font-size:20px;letter-spacing:4px;margin-bottom:12px}
.lockerr{color:var(--red);min-height:1.5em;margin-top:10px}

/* Toast */
.toast{position:fixed;inset-inline:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast.ok{border-inline-start:6px solid var(--green)}
.toast.err{border-inline-start:6px solid var(--red)}
.toast .msg{flex:1;white-space:pre-line}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== Glass look ===== */
:root{
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.78);
  --glass-input:rgba(255,255,255,.45);
  --glass-border:rgba(255,255,255,.75);
  --glass-edge:rgba(28,36,51,.08);
  --glass-shadow:0 10px 30px rgba(35,71,168,.10),0 1px 0 rgba(255,255,255,.9) inset;
  --blob1:rgba(35,71,168,.28);--blob2:rgba(185,138,78,.30);--blob3:rgba(124,77,255,.20);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --glass:rgba(40,48,64,.42);--glass-strong:rgba(30,36,48,.78);--glass-input:rgba(20,24,32,.45);
    --glass-border:rgba(255,255,255,.10);--glass-edge:rgba(255,255,255,.06);
    --glass-shadow:0 12px 32px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.08) inset;
    --blob1:rgba(124,155,255,.30);--blob2:rgba(211,168,106,.22);--blob3:rgba(160,110,255,.24);
  }
}
:root[data-theme="dark"]{
  --glass:rgba(40,48,64,.42);--glass-strong:rgba(30,36,48,.78);--glass-input:rgba(20,24,32,.45);
  --glass-border:rgba(255,255,255,.10);--glass-edge:rgba(255,255,255,.06);
  --glass-shadow:0 12px 32px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.08) inset;
  --blob1:rgba(124,155,255,.30);--blob2:rgba(211,168,106,.22);--blob3:rgba(160,110,255,.24);
}
body::after{background:
  radial-gradient(55% 35% at 92% 6%,var(--blob1),transparent 70%),
  radial-gradient(50% 32% at 4% 42%,var(--blob3),transparent 70%),

.panel,.card,.quick,.stat,.profit,.plan,.seg,.tablewrap,.calc,.ocard,.feat,.chips button,.qtybox button,.qtybox input{
  background:var(--glass);
  border:1px solid var(--glass-border);

}
.panel,.card,.profit,.tablewrap{border-radius:18px}
.quick,.stat,.ocard,.plan,.calc{border-radius:14px}

.qty{background:color-mix(in srgb,var(--tan) 18%,transparent)}

input:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--blue) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 18%,transparent)}

/* Who's using (login) */
.whogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}
.who{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);color:var(--ink);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .15s,box-shadow .15s}
.who .av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--blue),var(--tan));box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 35%,transparent)}
.who.staff .av{background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 55%,#6b7280),color-mix(in srgb,var(--tan) 55%,#6b7280))}
.who b{font-size:14px;line-height:1.25;text-align:center;word-break:break-word}
.who small{font-size:11px;color:var(--muted)}
.who[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 35%,transparent);transform:translateY(-2px)}
.otheracct{display:block;margin:14px auto 0;font-size:14px}
.lock.paywall{z-index:45}
.lockerr.info{color:var(--green)}
</style>
</head>
<body>
<header>
  <h1 id="appTitle"></h1>
</header>
<div class="subbanner" id="subBanner" hidden></div>

<main class="wrap">
  <!-- SELL -->
  <section id="tab-sell">
    <div class="hero">
      <button class="scanbtn" id="scanSell">
        <span class="bars" aria-hidden="true"><i style="width:4px"></i><i style="width:2px"></i><i style="width:6px"></i><i style="width:2px"></i><i style="width:3px"></i><i style="width:5px"></i><i style="width:2px"></i><i style="width:4px"></i><i style="width:2px"></i><i style="width:6px"></i><i style="width:3px"></i></span>
        <span data-t="scanToSell"></span>
      </button>
      <div class="qtywrap"><span class="lbl" data-t="qty"></span>
        <div class="qtybox" dir="ltr"><button type="button" data-q="-1" aria-label="minus">−</button><input type="number" class="qv" value="1" min="1" inputmode="numeric" aria-label="quantity"><button type="button" data-q="1" aria-label="plus">+</button></div>
        <div class="seg unitseg" role="group"><button type="button" data-unit="piece" aria-pressed="true" data-t="pieceW"></button><button type="button" data-unit="carton" aria-pressed="false" data-t="cartonW"></button></div>
      </div>
    </div>
    <div class="row">
      <input type="text" id="codeInput" inputmode="numeric" autocomplete="off" data-tp="typeCode">
      <button class="btn blue" id="codeGo" data-t="go"></button>
    </div>
    <div id="quickWrap" hidden><h2 data-t="quickItems"></h2><div class="qgrid" id="quickGrid"></div></div>
    <div class="panel order" id="orderPanel">
      <div class="order-head"><h3 id="orderTitle"></h3><bdi class="order-total" id="orderTotal"></bdi></div>
      <div id="orderLines"></div>
      <button class="btn blue wide" id="finishOrder" data-t="newCustomer"></button>
      <button class="btn ghost wide" id="creditOrder" data-t="onCredit" style="margin-top:8px"></button>
      <button class="btn ghost wide" id="discBtn" data-t="discount" style="margin-top:8px"></button>
      <p class="muted" style="margin:10px 0 0" data-t="autoNote"></p>
    </div>
  </section>

  <!-- STOCK -->
  <section id="tab-stock" hidden>
    <div class="toolbar">
      <input type="search" id="stockSearch" data-tp="search">
      <button class="btn blue" id="newProduct" data-t="addProduct"></button>
    </div>
    <div class="row" style="margin:-4px 0 12px"><button class="btn ghost" id="impBtn" data-t="importX" style="flex:1"></button><button class="btn ghost" id="tplBtn" data-t="template" style="flex:1"></button><input type="file" id="impFile" accept=".xlsx,.xls,.csv" hidden></div>
    <div class="list" id="stockList"></div>
  </section>

  <!-- ACCOUNTS -->
  <section id="tab-dash" hidden>
    <div id="dashPeriodSlot"></div>
    <div class="profit">
      <div class="lbl" data-t="netProfit"></div>
      <div class="big" id="accNet"></div>
      <div class="sub"><span><span data-t="grossProfit"></span>: <bdi id="accProfit"></bdi></span><span><span data-t="expensesW"></span>: <bdi id="accExp"></bdi></span></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="lbl" data-t="salesTotal"></div><div class="v" id="accSales"></div></div>
      <div class="stat"><div class="lbl" data-t="costTotal"></div><div class="v" id="accCost"></div></div>
      <div class="stat"><div class="lbl" data-t="itemsSold"></div><div class="v" id="accQty"></div></div>
    </div>
    <div class="panel repcard">
      <div class="rep-head"><h3 data-t="dailySales"></h3><bdi class="rep-total" id="secRep"></bdi></div>
      <div id="chartBox"></div>
      <h3 class="subh" data-t="topItems"></h3>
      <div id="topBox"></div>
    </div>
    <details class="sec">
      <summary><span data-t="dayClose"></span><bdi class="sec-meta" id="secClose"></bdi><svg class="sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="sec-body">
        <div id="closeBox"></div>
        <div class="field" style="margin-top:10px"><label for="countCash" data-t="countedCash"></label><input type="number" id="countCash" min="0" step="any" inputmode="decimal"></div>
        <button class="btn blue wide" id="closeDayBtn" data-t="dayClose"></button>
        <div class="list" id="closeList" style="margin-top:10px"></div>
      </div>
    </details>
    <details class="sec">
      <summary><span data-t="expensesW"></span><bdi class="sec-meta" id="secExp"></bdi><svg class="sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="sec-body">
        <button class="btn ghost wide" id="addExp" data-t="addExpense"></button>
        <div class="list" id="expList" style="margin-top:10px"></div>
      </div>
    </details>
  </section>

  <section id="tab-acc" hidden>
    <div id="accPeriodSlot"><div id="periodBlock">
      <div class="seg" role="group">
      <button data-period="day" aria-pressed="true" data-t="today"></button>
      <button data-period="range" aria-pressed="false" data-t="pickDates"></button>
    </div>
    <div class="range" id="rangeBox" hidden>
      <div class="field"><label for="rFrom" data-t="from"></label><input type="date" id="rFrom"></div>
      <div class="field"><label for="rTo" data-t="to"></label><input type="date" id="rTo"></div>
    </div>
    </div></div>
    <details class="sec">
      <summary><span data-t="purchases"></span><bdi class="sec-meta" id="secBuy"></bdi><svg class="sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="sec-body">
        <div class="list" id="buyList"></div>
      </div>
    </details>
    <details class="sec">
      <summary><span data-t="debts"></span><bdi class="sec-meta" id="secDebt"></bdi><svg class="sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="sec-body">
        <div class="panel debtsum"><span class="muted" style="margin:0" data-t="totalDebt"></span><bdi id="debtTotal" style="font-size:22px;font-weight:700;color:var(--red)"></bdi></div>
        <div class="toolbar" style="margin-top:10px"><input type="search" id="custSearch" data-tp="search"><button class="btn ghost" id="addCust" data-t="addCustomer"></button></div>
        <div class="list" id="custList"></div>
      </div>
    </details>
    <details class="sec">
      <summary><span data-t="byProduct"></span><bdi class="sec-meta" id="secProd"></bdi><svg class="sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="sec-body">
        <div id="accByProduct"></div>
      </div>
    </details>
    <details class="sec">
      <summary><span data-t="lowStock"></span><bdi class="sec-meta" id="secLow"></bdi><svg class="sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="sec-body">
        <div class="list" id="accLow"></div>
        <div id="accExp2Wrap" hidden><h3 class="subh" data-t="expiringSoon"></h3><div class="list" id="accExp2"></div></div>
      </div>
    </details>
    <details class="sec">
      <summary><span data-t="orders"></span><bdi class="sec-meta" id="secOrd"></bdi><svg class="sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="sec-body">
        <div class="list" id="accRecent"></div>
      </div>
    </details>
  </section>

  <!-- ACCOUNT / SETTINGS -->
  <section id="tab-set" hidden>
    <div class="panel" id="serialCard" hidden style="margin-top:12px">
      <div class="muted" style="margin:0" data-t="acctNo"></div>
      <div class="pwcode"><bdi id="serialNo"></bdi></div>
      <button class="btn ghost" id="serialCopy" data-t="copyCode" style="margin-top:8px"></button>
    </div>
    <div class="panel subcard" id="subCard" hidden>
      <div class="lbl" data-t="subscription"></div>
      <div id="subStatus" style="font-weight:700;font-size:17px"></div>
      <div class="muted" style="margin:6px 0 10px"><span data-t="yourCode"></span>: <bdi id="subCode" style="font-weight:700;color:var(--ink)"></bdi></div>
      <div id="subPrice" style="font-weight:700;margin-bottom:4px"></div>
      <div id="subPayInfo" class="muted" style="white-space:pre-line"></div>
      <button class="btn ghost" id="subCopy" data-t="copyCode"></button>
    </div>
    <details class="sec" id="secProfile">
      <summary><span data-t="profileH"></span><bdi class="sec-meta" id="secProfileMeta"></bdi><svg class="sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="sec-body">
    <div class="sec-inner">
      <div class="field"><label for="sShop" data-t="shopName"></label><input type="text" id="sShop" autocomplete="organization"></div>
      <div class="field"><label for="sOwner" data-t="ownerName"></label><input type="text" id="sOwner" autocomplete="name"></div>
      <div class="field"><label for="sPhone" data-t="phone"></label><div class="phonerow" dir="ltr"><select class="cc" id="sCC" aria-label="Country code"></select><input type="tel" id="sPhone" autocomplete="tel-national"></div></div>
      <div class="field"><label for="sEmail" data-t="email"></label><input type="email" id="sEmail" autocomplete="email" dir="ltr"></div>
      <button class="btn blue wide" id="sSave" data-t="save"></button>
    </div>
      </div>
    </details>

    <div class="panel prefrow">
      <label class="pref"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg><select id="langSel" aria-label="Language"><option value="ku">کوردی</option><option value="ar">عربي</option><option value="en">English</option></select><span class="pref-chev" aria-hidden="true">▾</span></label>
      <label class="pref"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><select id="themeSel" aria-label="Theme"><option value="auto" data-t="themeAuto"></option><option value="light" data-t="themeLight"></option><option value="dark" data-t="themeDark"></option></select><span class="pref-chev" aria-hidden="true">▾</span></label>
      <label class="pref"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2 0 0 0-2.5-1.5c-1.7 0-2.5 1-2.5 2 0 2.5 5 1.5 5 4 0 1-1 2-2.5 2A2.6 2 0 0 1 9.5 15M12 6v1.5M12 16.5V18"/></svg><select id="curSel" aria-label="Currency"><option value="USD">$ USD</option><option value="IQD">IQD</option></select><span class="pref-chev" aria-hidden="true">▾</span></label>
    </div>
    <div class="panel swatches" id="palRow" role="group" aria-label="Colour"></div>

    <details class="sec" id="secLock">
      <summary><span data-t="lockH"></span><bdi class="sec-meta" id="secLockMeta"></bdi><svg class="sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="sec-body">
    <div class="sec-inner">
      <div class="switchrow"><label for="pinToggle" data-t="pinToggle"></label><span class="switch" dir="ltr"><input type="checkbox" id="pinToggle" role="switch"><span></span></span></div>
      <p class="muted" id="pinStatus"></p>
      <p class="muted" data-t="lockNote"></p>
      <div class="field" id="curPinField"><label for="pinCur" data-t="curPin"></label><input type="password" id="pinCur" autocomplete="current-password"></div>
      <div class="field"><label for="pinNew" data-t="newPin"></label><input type="password" id="pinNew" autocomplete="new-password"></div>
      <div class="field"><label for="pinNew2" data-t="confirmPin"></label><input type="password" id="pinNew2" autocomplete="new-password"></div>
      <button class="btn blue wide" id="pinSave"></button>
      <div class="sheet-actions"><button class="btn ghost" id="lockNow" data-t="lockNow"></button></div>
    </div>
      </div>
    </details>
    <div class="panel" id="memberExit" hidden style="margin-top:14px">
      <h3 style="margin:0 0 6px" id="memberWho"></h3>
      <div class="field"><label for="memberOffPass" data-t="ownerPass"></label><input type="password" id="memberOffPass" autocomplete="current-password"></div>
      <button class="btn blue wide" id="memberOff" data-t="exitMember"></button>
    </div>
    <div class="panel" id="cashierPanel" hidden style="margin-top:14px">
      <div class="switchrow"><span data-t="cashierMode"></span><button class="btn ghost" id="cashierOn" data-t="startCashier"></button></div>
      <p class="muted" style="margin:0" data-t="cashierNote"></p>
    </div>
    <div class="panel" id="backupPanel" style="margin-top:14px">
      <div class="switchrow"><span data-t="backupH"></span><button class="btn ghost" id="exportBtn" data-t="exportXlsx"></button></div>
      <p class="muted" style="margin:0" data-t="backupNote"></p>
    </div>
    <div class="panel" id="cashierExit" hidden style="margin-top:14px">
      <h3 style="margin:0 0 6px" data-t="cashierOnTitle"></h3>
      <p class="muted" data-t="cashierNote"></p>
      <div class="field"><label for="cashierPass" data-t="lockH"></label><input type="password" id="cashierPass" autocomplete="current-password"></div>
      <button class="btn blue wide" id="cashierOff" data-t="exitCashier"></button>
    </div>
    <button class="btn danger wide" id="logoutBtn" style="margin-top:24px;display:flex;align-items:center;justify-content:center;gap:8px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg><span data-t="logout"></span></button>
  </section>

  <!-- TEAM (owner only) -->
  <section id="tab-team" hidden>
    <p class="muted" style="margin:6px 0 12px" data-t="teamNote"></p>
    <button class="btn blue wide" id="addMember" data-t="addMember"></button>
    <div class="list" id="teamList" style="margin-top:12px"></div>
  </section>

  <!-- ADMIN (owner only) -->
  <section id="tab-adm" hidden>
    <div class="stats admstats">
      <div class="stat"><div class="lbl" data-t="stActive"></div><div class="v" id="admActive">0</div></div>
      <div class="stat"><div class="lbl" data-t="stExpired"></div><div class="v" id="admExpired">0</div></div>
      <div class="stat"><div class="lbl" data-t="stNew"></div><div class="v" id="admNew">0</div></div>
      <div class="stat"><div class="lbl" data-t="incomeMonth"></div><div class="v" id="admIncome" style="color:var(--green)">$0.00</div></div>
    </div>
    <div class="plans" id="admPlans" style="margin-top:12px"></div>
    <h2 data-t="markets"></h2>
    <div class="toolbar"><input type="search" id="admSearch" data-tp="search"><button class="btn ghost" id="admRefresh" data-t="refresh"></button></div>
    <div class="list" id="admList"></div>
    <h2 data-t="actLog"></h2>
    <div id="admLog"></div>
  </section>
</main>

<nav>
  <div class="in">
    <button data-tab="sell" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6v12M7 6v12M11 6v12M14 6v12M17 6v12M20 6v12"/></svg>
      <span data-t="sell"></span>
    </button>
    <button data-tab="stock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>
      <span data-t="stock"></span>
    </button>
    <button data-tab="dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13a9 9 0 0 1 18 0"/><path d="M12 13l4-5"/><circle cx="12" cy="13" r="1.4"/><path d="M5 19h14"/></svg>
      <span data-t="dashboard"></span>
    </button>
    <button data-tab="acc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span data-t="accounts"></span>
    </button>
    <button data-tab="team" id="navTeam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M16.5 14.6c2.8.2 5 1.9 5 4.9"/></svg>
      <span data-t="team"></span>
    </button>
    <button data-tab="set">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span data-t="account"></span>
    </button>
    <button data-tab="adm" id="navAdmin" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      <span data-t="admin"></span>
    </button>
  </div>
</nav>

<!-- Scanner -->
<div class="overlay" id="scanOverlay" hidden>
  <div class="sheet">
    <div id="reader"></div>
    <div class="scanmsg" id="scanMsg"></div>
    <div class="qtywrap"><span class="lbl" data-t="qty"></span>
      <div class="qtybox" dir="ltr"><button type="button" data-q="-1" aria-label="minus">−</button><input type="number" class="qv" value="1" min="1" inputmode="numeric" aria-label="quantity"><button type="button" data-q="1" aria-label="plus">+</button></div>
        <div class="seg unitseg" role="group"><button type="button" data-unit="piece" aria-pressed="true" data-t="pieceW"></button><button type="button" data-unit="carton" aria-pressed="false" data-t="cartonW"></button></div>
    </div>
    <div class="row">
      <input type="text" id="scanManual" inputmode="numeric" autocomplete="off" data-tp="typeCode">
      <button class="btn blue" id="scanManualGo">OK</button>
    </div>
    <div class="sheet-actions" style="margin-top:10px"><button class="btn ghost" id="photoBtn" style="color:#fff;border-color:#555;display:flex;align-items:center;justify-content:center;gap:6px"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-t="takePhoto"></span></button></div>
    <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
    <div id="readerFile" style="display:none"></div>
    <div class="sheet-actions"><button class="btn ghost" id="torchBtn" aria-pressed="false" style="color:#fff;border-color:#555;display:flex;align-items:center;justify-content:center;gap:6px"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span id="torchLbl"></span></button><button class="btn ghost" id="scanClose" style="color:#fff;border-color:#555" data-t="stopCamera"></button></div>
  </div>
</div>

<!-- Product form -->
<div class="overlay" id="formOverlay" hidden>
  <form class="sheet" id="pform" novalidate>
    <h2 id="formTitle"></h2>
    <div class="field"><label for="fName" data-t="name"></label><input type="text" id="fName" autocomplete="off"></div>
    <div class="field"><label for="fCode" data-t="barcode"></label>
      <div class="row"><input type="text" id="fCode" inputmode="numeric" autocomplete="off"><button type="button" class="btn" id="fScan" data-t="scan"></button></div>
    </div>
    <div class="field"><label for="fPer" data-t="perCarton"></label><input type="number" id="fPer" min="1" step="1" inputmode="numeric"></div>

function wavURI(parts){
  const sr=22050,total=parts.reduce((a,p)=>a+Math.floor(sr*p[1]),0),buf=new ArrayBuffer(44+total*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+total*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,total*2,true);
  let o=44;parts.forEach(([f,d])=>{const n=Math.floor(sr*d);for(let i=0;i<n;i++){const env=Math.min(1,i/120,(n-i)/300);const s=f?(Math.sin(2*Math.PI*f*i/sr)>0?1:-1)*.45*env:0;v.setInt16(o,s*32767,true);o+=2}});
  let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return 'data:audio/wav;base64,'+btoa(bin);
}

function tone(freq,dur,type,vol,at=0){
  const a=audio();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+at;
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.005);
  g.gain.setValueAtTime(vol,t0+dur-.01);g.gain.linearRampToValueAtTime(0,t0+dur);

function sellProduct(p,q=1,unit='piece'){
  const per=Math.max(1,p.perCarton|0),carton=unit==='carton'&&!p.byWeight&&per>1;
  const pcs=carton?q*per:q;
  if(!(pcs>0))return;
  if(p.pieces<pcs-1e-9){beep(false);toast(p.name+'\n'+t('left')+': '+stockText(p),'err');return}
  ensureMonth();
  p.pieces=Math.round((p.pieces-pcs)*1000)/1000;
  const unitPrice=carton?((+p.cartonPrice||(+p.price||0)*per)/per):(+p.price||0);
  const sale={id:uid(),o:activeOrder(),t:Date.now(),p:p.id,n:p.name,q:pcs,s:Math.round(unitPrice*10000)/10000,c:Math.round(costPer(p)*10000)/10000};
  if(carton){sale.u='c';sale.k=per}else if(p.byWeight)sale.u='kg';
  {const mb=member();if(mb)sale.by=mb.name}
  sales.push(sale);saveProducts();saveSales();renderAll();beep(true);
  toast(t('sold')+': '+qtyLabel(sale)+' \u00d7 '+p.name+'\n'+t('left')+': '+stockText(p),'ok',{label:t('undo'),fn:()=>undoSale(sale.id)});

    if(caps&&caps.torchFeature){const tf=caps.torchFeature();if(!tf.isSupported())return false;await tf.apply(on);return true}

}

function renderAcc(){
  ensureMonth();

  $('#rangeBox').hidden=period!=='range';

  if(period==='day')list=sales.filter(s=>dayOf(s.t)===today);

  let rev=0,cost=0,qty=0;const per={};
  list.forEach(s=>{const r=s.s*s.q,c=s.c*s.q;rev+=r;cost+=c;if(!String(s.p).startsWith('_'))qty+=s.q;
    const k=s.p;per[k]=per[k]||{n:s.n,q:0,r:0,pr:0};per[k].q+=s.q;per[k].r+=r;per[k].pr+=r-c});
  const prof=rev-cost;
  $('#accProfit').textContent=money(prof);

  $('#accNet').textContent=money(net);$('#accNet').className='big'+(net<0?' neg':'');
  renderExpenses(ex.list);
  $('#secExp').textContent=money(ex.total);
  $('#accSales').textContent=money(rev);$('#accCost').textContent=money(cost);$('#accQty').textContent=fmtQ(qty);
  const rows=Object.entries(per).filter(([k])=>!String(k).startsWith('_')).map(([,v])=>v).sort((a,b)=>b.pr-a.pr);
  $('#accByProduct').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>${t('product')}</th><th>${t('qty')}</th><th>${t('salesTotal')}</th><th>${t('profit')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${fmtQ(r.q)}</td><td><bdi>${money(r.r)}</bdi></td><td class="pos"><bdi>${money(r.pr)}</bdi></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('noSales')}</div>`;
  const low=products.filter(isLow).sort((a,b)=>a.pieces-b.pieces);
  const exps=products.filter(expSoon).sort((a,b)=>a.expiry.localeCompare(b.expiry));
  $('#accLow').innerHTML=low.length?low.map(p=>`<button class="quick" data-edit="${p.id}"><span><b>${esc(p.name)}</b><small>${esc(stockText(p))}</small></span><span class="badge">${t('low')}</span></button>`).join(''):`<div class="empty">${t('noLow')}</div>`;

  const groups={};
  list.forEach(s=>{const k=s.o??0;(groups[k]=groups[k]||[]).push(s)});
  const ords=Object.entries(groups).map(([k,ls])=>({o:+k,ls,last:ls[ls.length-1].t,tot:ls.reduce((a,s)=>a+s.s*s.q,0),pr:ls.reduce((a,s)=>a+(s.s-s.c)*s.q,0),q:ls.reduce((a,s)=>a+s.q,0)})).sort((a,b)=>b.last-a.last).slice(0,40);
  $('#accRecent').innerHTML=ords.length?ords.map(g=>{const d=new Date(g.last);const tm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    return `<button class="ocard" data-order="${g.o}"><span><span class="num">${g.o?t('receipt')+' #'+g.o:t('oldSales')}</span><small><bdi>${period!=='day'?d.getDate()+'/'+(d.getMonth()+1)+' ':''}${tm}</bdi>, ${g.q} ${t('pieceUnit')}, ${t('profit')} <bdi class="pos">${money(g.pr)}</bdi></small></span><bdi class="price" style="font-weight:700">${money(g.tot)}</bdi></button>`}).join(''):`<div class="empty">${t('noSales')}</div>`;
  $('#secProd').textContent=rows.length;$('#secLow').textContent=low.length+exps.length;$('#secOrd').textContent=ords.length;
  renderReports(list,per,today);renderPurchases();renderClose();

/* ---------- Date range ---------- */
const monthCache={};
function getRange(){
  let f=$('#rFrom').value,tv=$('#rTo').value;
  if(!f)f=monthKey+'-01';if(!tv)tv=dayOf(Date.now());
  if(f>tv)[f,tv]=[tv,f];
  return {from:f,to:tv};
}
function monthsBetween(f,tv){
  const out=[];let [y,m]=f.slice(0,7).split('-').map(Number);const [ey,em]=tv.slice(0,7).split('-').map(Number);let g=0;
  while((y<ey||(y===ey&&m<=em))&&g++<60){out.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}
  return out;
}
async function loadRange(){
  const {from,to}=getRange();
  const need=monthsBetween(from,to).filter(m=>m!==monthKey&&!(m in monthCache));
  for(const m of need){
    monthCache[m]=lsGet('shop.sales.'+m,[]);
    if(db&&base){try{const s=await db.doc(DP(base+'/sales-'+m)).get();if(s.exists){monthCache[m]=JSON.parse(JSON.stringify(s.data().list||[]));lsSet('shop.sales.'+m,monthCache[m])}}catch(e){}}
  }
  renderAcc();
}
$('#rFrom').value=monthKey+'-01';$('#rTo').value=dayOf(Date.now());
$('#rFrom').max=$('#rTo').max=dayOf(Date.now());
['#rFrom','#rTo'].forEach(s=>$(s).addEventListener('change',loadRange));

let pendingSell=null;
function askSell(p){
  pendingSell=p;$('#cfName').textContent=p.name;
  $('#cfQty').value=sellQty;$('#cfQty').step=p.byWeight?'0.05':'1';
  updCf();$('#confirmOverlay').hidden=false;
}
function updCf(){
  const p=pendingSell;if(!p)return;
  const q=parseFloat($('#cfQty').value)||0,per=Math.max(1,p.perCarton|0),carton=sellUnit==='carton'&&!p.byWeight&&per>1;
  const each=carton?(+p.cartonPrice||(+p.price||0)*per):(+p.price||0);
  $('#cfSum').textContent=fmtQ(q)+(p.byWeight?' kg':carton?' '+t('cartonUnit'):'')+' \u00d7 '+money(each)+' = '+money(q*each);
}

/* ---------- Orders ---------- */
const ORDER_IDLE=10*60*1000;
const orderSales=o=>sales.filter(s=>(s.o??0)===o);
function openOrderNum(){
  const cur=settings.curOrder;if(!cur)return null;
  const ls=orderSales(cur),last=ls[ls.length-1];
  return (!last||Date.now()-last.t<ORDER_IDLE)?cur:null;
}
function activeOrder(){
  const cur=openOrderNum();if(cur)return cur;
  settings.orderSeq=(settings.orderSeq||0)+1;settings.curOrder=settings.orderSeq;saveSettings();
  return settings.curOrder;
}
function groupLines(ls){
  const m={};ls.forEach(s=>{const k=s.p+'|'+s.s;m[k]=m[k]||{p:s.p,n:s.n,q:0,s:s.s,u:s.u,k:s.k};m[k].q+=s.q});
  return Object.values(m);
}
function lineQty(l){if(String(l.p).startsWith('_'))return '';return l.u==='c'?fmtQ(l.q/l.k)+' '+t('cartonUnit')+' \u00d7 '+money(l.s*l.k):l.u==='kg'?fmtQ(l.q)+' kg \u00d7 '+money(l.s):fmtQ(l.q)+' \u00d7 '+money(l.s)}
function renderOrder(){
  const cur=openOrderNum(),ls=cur?orderSales(cur):[];
  $('#orderTitle').textContent=ls.length?t('orderNow')+' #'+cur:t('newOrderTitle');
  const tot=ls.reduce((a,s)=>a+s.s*s.q,0);
  $('#orderTotal').textContent=money(tot);
  $('#orderLines').innerHTML=ls.length?groupLines(ls).map(l=>`<div class="oline"><span>${esc(l.n)}<br><small><bdi>${lineQty(l)}</bdi></small></span><span class="oamt"><bdi>${money(l.q*l.s)}</bdi><button class="odel" data-odel="${esc(l.p)}|${l.s}" aria-label="${t('delete')}">×</button></span></div>`).join(''):'';
  $('#finishOrder').disabled=!ls.length;$('#creditOrder').disabled=!ls.length;$('#discBtn').disabled=!ls.length;
}
function finishOrder(){
  const cur=openOrderNum();if(!cur||!orderSales(cur).length)return;
  settings.curOrder=null;saveSettings();renderAll();
  toast(t('orderDone')+' #'+cur,'ok');openReceipt(cur);
}
function openReceipt(o){
  const ls=sales.concat(...Object.values(monthCache)).filter(s=>(s.o??0)===o).sort((a,b)=>a.t-b.t);if(!ls.length)return;
  const d=new Date(ls[ls.length-1].t),p2=n=>String(n).padStart(2,'0');
  const when=d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes());
  const lines=groupLines(ls),tot=ls.reduce((a,s)=>a+s.s*s.q,0),retTot=ls.filter(s=>s.ret).reduce((a,s)=>a-s.s*s.q,0);
  const sub=[settings.ownerName,settings.phone].filter(Boolean).map(esc).join(', ');
  const crc=customers.find(c=>(c.entries||[]).some(e=>e.type==='debt'&&e.o===o));
  $('#receiptBody').innerHTML=`<div class="rc">
    <div class="rc-shop">${esc(settings.shopName||t('app'))}</div>${sub?`<div class="rc-sub"><bdi>${sub}</bdi></div>`:''}
    <div class="rc-meta"><span>${o?t('receipt')+' #'+o:t('oldSales')}</span><bdi>${when}</bdi></div>
    ${ls.find(s=>s.by)?`<div class="rc-sub" style="text-align:start;margin:-4px 0 8px">${t('cashierW')}: ${esc(ls.find(s=>s.by).by)}</div>`:''}
    <table><thead><tr><th>${t('product')}</th><th>${t('qty')}</th><th>${t('price')}</th><th>${t('total')}</th></tr></thead>
    <tbody>${lines.filter(l=>l.q>1e-9||String(l.p).startsWith('_')).map(l=>{const disc=String(l.p).startsWith('_');const qd=disc?'':l.u==='c'?fmtQ(l.q/l.k)+' '+t('cartonUnit'):l.u==='kg'?fmtQ(l.q)+' kg':fmtQ(l.q);const pd=disc?'':money(l.u==='c'?l.s*l.k:l.s);return `<tr><td>${esc(l.n)}${o&&!disc?`<br><button class="retbtn" data-ret="${o}|${esc(l.p)}|${l.s}">\u21a9 ${t('returnW')}</button>`:''}</td><td>${qd}</td><td><bdi>${pd}</bdi></td><td><bdi>${money(l.q*l.s)}</bdi></td></tr>`}).join('')}</tbody></table>
    ${retTot>0?`<div style="margin-top:8px;color:#5F6876">${t('returnedTotal')}: <bdi>${money(retTot)}</bdi></div>`:''}
    <div class="rc-total"><span>${t('total')}</span><bdi>${money(tot)}</bdi></div>
    ${crc?`<div style="margin-top:10px;font-weight:700;color:#B3261E">${t('onCreditFor')}: ${esc(crc.name)}</div>`:''}
  </div>`;
  $('#receiptOverlay').hidden=false;
}

let hidBuf='',hidLast=0;
document.addEventListener('keydown',e=>{
  const a=document.activeElement,typing=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
  if(typing||tab!=='sell')return;
  if([...$$('.overlay,.lock,.onb')].some(o=>!o.hidden))return;
  const now=Date.now();if(now-hidLast>80)hidBuf='';hidLast=now;
  if(e.key==='Enter'){if(hidBuf.length>=6){e.preventDefault();sellByCode(hidBuf)}hidBuf='';return}
  if(e.key.length===1&&/[0-9A-Za-z\-]/.test(e.key))hidBuf+=e.key;

/* ---------- Customers + debts ---------- */
let customers=lsGet('shop.customers',[]);
let crMode=null,crOrder=null,openCustId=null;
function saveCustomers(){lsSet('shop.customers',customers);if(base)queue(base+'/customers',{items:customers})}
const balanceOf=c=>(c.entries||[]).reduce((a,e)=>a+(e.type==='debt'?+e.a:-e.a),0);
const r2=n=>Math.round(n*100)/100;
function renderDebts(){
  const tot=customers.reduce((a,c)=>a+Math.max(0,balanceOf(c)),0);
  $('#debtTotal').textContent=money(tot);
  $('#secDebt').textContent=money(tot);
  const q=$('#custSearch').value.trim().toLowerCase();
  const list=customers.filter(c=>!q||(c.name+' '+(c.phone||'')).toLowerCase().includes(q)).sort((a,b)=>balanceOf(b)-balanceOf(a));
  $('#custList').innerHTML=list.length?list.map(c=>{const b=r2(balanceOf(c));return `<button class="quick" data-cust="${c.id}"><span><b>${esc(c.name)}</b>${c.phone?`<small><bdi>${esc(c.phone)}</bdi></small>`:''}</span>${b>0?`<bdi class="price debt">${money(b)}</bdi>`:`<span class="paidup">${t('cleared')}</span>`}</button>`}).join(''):`<div class="empty">${t('noCustomers')}</div>`;
}
function openPicker(mode,o){
  crMode=mode;crOrder=o||null;
  $('#crTitle').textContent=mode==='order'?t('chooseCustomer'):t('addCustomer');
  $('#crSearch').value='';$('#crName').value='';$('#crPhone').value='';
  $('#crSearch').hidden=mode!=='order';$('#crList').hidden=mode!=='order';
  renderPicker();$('#creditOverlay').hidden=false;
}
function renderPicker(){
  if(crMode!=='order')return;
  const q=$('#crSearch').value.trim().toLowerCase();
  const list=customers.filter(c=>!q||(c.name+' '+(c.phone||'')).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  $('#crList').innerHTML=list.map(c=>{const b=r2(balanceOf(c));return `<button class="quick" data-pick="${c.id}"><span><b>${esc(c.name)}</b>${c.phone?`<small><bdi>${esc(c.phone)}</bdi></small>`:''}</span><bdi class="price${b>0?' debt':''}">${money(b)}</bdi></button>`}).join('');
}
function closePicker(){$('#creditOverlay').hidden=true;crMode=null;crOrder=null}
function chargeOrder(c){
  const o=crOrder,ls=orderSales(o);
  if(!ls.length){closePicker();return}
  const tot=r2(ls.reduce((a,s)=>a+s.s*s.q,0));
  c.entries=c.entries||[];c.entries.push({t:Date.now(),type:'debt',a:tot,o});
  saveCustomers();closePicker();
  if(settings.curOrder===o){settings.curOrder=null;saveSettings()}
  renderAll();toast(t('debtAdded')+': '+c.name+'\n'+money(tot),'ok');openReceipt(o);
}
$('#creditOrder').onclick=()=>{const cur=openOrderNum();if(cur&&orderSales(cur).length)openPicker('order',cur)};
$('#addCust').onclick=()=>openPicker('add');
$('#crSearch').addEventListener('input',renderPicker);
$('#crClose').onclick=closePicker;

  const c={id:uid(),name,phone:$('#crPhone').value.trim(),entries:[]};
  customers.push(c);saveCustomers();
  if(crMode==='order')chargeOrder(c);else{closePicker();renderDebts();toast(t('saved'),'ok')}
};

  const b=r2(balanceOf(c));
  $('#cuName').textContent=c.name;
  $('#cuPhone').innerHTML=c.phone?`<bdi>${esc(c.phone)}</bdi>`:'';
  $('#cuBal').textContent=money(b);$('#cuBal').className='big'+(b>0?' neg':'');
  $('#cuAmt').value='';
  delete $('#cuDel').dataset.armed;$('#cuDel').textContent=t('deleteCust');
  const hist=(c.entries||[]).slice().reverse();
  $('#cuHist').innerHTML=hist.length?hist.map(e=>`<div class="hist"><span>${e.type==='debt'?t('boughtW')+(e.o?` <button class="linkbtn" data-order="${e.o}">#${e.o}</button>`:''):t('paidW')}<br><small class="muted"><bdi>${fmtDate(e.t)}</bdi></small></span><bdi class="${e.type==='debt'?'debt':'paidup'}">${e.type==='debt'?'+':'−'}${money(e.a)}</bdi></div>`).join(''):`<div class="empty">${t('noSales')}</div>`;
  $('#custOverlay').hidden=false;
}
function closeCust(){$('#custOverlay').hidden=true;openCustId=null}
function recordPay(amount){
  const c=customers.find(x=>x.id===openCustId);if(!c)return;

/* day close */
function dayFigures(){
  const td=dayOf(Date.now());
  const rev=sales.filter(s=>dayOf(s.t)===td).reduce((a,s)=>a+s.s*s.q,0);
  let credit=0,creditRet=0,paid=0;
  customers.forEach(c=>(c.entries||[]).forEach(x=>{if(dayOf(x.t)!==td)return;if(x.type==='debt')credit+=+x.a||0;else if(x.ret)creditRet+=+x.a||0;else paid+=+x.a||0}));
  const exp=expenses.filter(x=>dayOf(x.t)===td).reduce((a,x)=>a+(+x.a||0),0);
  const cash=rev-credit+creditRet;
  return {cash,credit,paid,exp,expected:cash+paid-exp};
}
function renderClose(){
  const f=dayFigures();
  $('#secClose').textContent=money(f.expected);
  $('#closeBox').innerHTML=[['cashSales',f.cash],['creditSales',f.credit],['debtPaid',f.paid],['expensesW',-f.exp]].map(([k,v])=>`<div class="calc"><span>${t(k)}</span><bdi>${money(v)}</bdi></div>`).join('')+`<div class="calc" style="font-weight:700"><span>${t('expectedCash')}</span><bdi>${money(f.expected)}</bdi></div>`;
  $('#closeList').innerHTML=closings.slice().reverse().slice(0,15).map(c=>`<div class="hist"><span><bdi>${fmtDate(c.t)}</bdi><br><small class="muted">${t('expectedCash')}: <bdi>${money(c.exp)}</bdi>, ${t('countedCash')}: <bdi>${money(c.cnt)}</bdi></small></span><bdi class="${Math.abs(c.diff)<0.005?'paidup':'debt'}">${c.diff>0?'+':''}${money(c.diff)}</bdi></div>`).join('');
}
$('#closeDayBtn').onclick=()=>{
  const cnt=parseFloat($('#countCash').value);if(!(cnt>=0)){toast(t('amountReq'),'err');return}
  const f=dayFigures();closings.push({t:Date.now(),exp:Math.round(f.expected*100)/100,cnt,diff:Math.round((cnt-f.expected)*100)/100});
  saveClosings();$('#countCash').value='';renderClose();toast(t('dayClosed'),'ok');
};

/* reports */
function renderReports(list,per,today){
  let days;
  if(period==='day'){const all=sales.concat(...Object.values(monthCache));days=[];for(let i=6;i>=0;i--){const d=dayOf(Date.now()-i*86400000);days.push([d,all.filter(s=>dayOf(s.t)===d).reduce((a,s)=>a+s.s*s.q,0)])}}
  else{const m={};list.forEach(s=>{const d=dayOf(s.t);m[d]=(m[d]||0)+s.s*s.q});days=Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).slice(-31)}
  const max=Math.max(1,...days.map(d=>d[1]));
  $('#secRep').textContent=money(days.reduce((a,d)=>a+d[1],0));
  if(!days.length){$('#chartBox').innerHTML=`<div class="empty">${t('noSales')}</div>`}
  else{
    const W=340,H=180,L=40,R=14,T=22,B=24,iw=W-L-R,ih=H-T-B,n=days.length;
    const raw=Math.max(...days.map(d=>d[1]),0),mx=raw>0?raw*1.15:1;
    const xs=i=>L+(n===1?iw/2:i*iw/(n-1)),ys=v=>T+ih-(Math.max(0,v)/mx)*ih;
    const pts=days.map(([d,v],i)=>[xs(i),ys(v)]);
    const cl=y=>Math.min(T+ih,Math.max(T,y));
    let line=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for(let i=0;i<n-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
      const c1=[p1[0]+(p2[0]-p0[0])/6,cl(p1[1]+(p2[1]-p0[1])/6)],c2=[p2[0]-(p3[0]-p1[0])/6,cl(p2[1]-(p3[1]-p1[1])/6)];
      line+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
    const area=line+` L${pts[n-1][0].toFixed(1)},${T+ih} L${pts[0][0].toFixed(1)},${T+ih} Z`;
    const short=v=>{const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(1)+'M':a>=1e3?(v/1e3).toFixed(a>=1e4?0:1)+'k':String(Math.round(v*100)/100)};
    const grid=[0,1,2,3].map(k=>{const y=T+ih*k/3;return `<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="yl" x="${L-8}" y="${y+3}" text-anchor="end">${short(mx*(1-k/3))}</text>`}).join('');
    const every=n<=10?1:Math.ceil(n/8);
    const xl=days.map(([d],i)=>i%every===0||i===n-1?`<text class="xl" x="${xs(i)}" y="${H-6}" text-anchor="middle">${+d.slice(8)}</text>`:'').join('');
    const dots=pts.map((p,i)=>i===n-1?'':`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="3"><title>${days[i][0]}: ${money(days[i][1])}</title></circle>`).join('');
    const lp=pts[n-1],lv=days[n-1][1];
    const lab=`<g class="tip"><rect x="${Math.min(W-R-64,Math.max(L,lp[0]-32))}" y="${Math.max(0,lp[1]-28)}" width="64" height="18" rx="9"/><text x="${Math.min(W-R-32,Math.max(L+32,lp[0]))}" y="${Math.max(0,lp[1]-28)+13}" text-anchor="middle">${short(lv)}</text></g>`;
    $('#chartBox').innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('dailySales')}"><defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--blue);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--blue);stop-opacity:0"/></linearGradient></defs>${grid}<path class="ar" d="${area}" fill="url(#gArea)"/><path class="ln" d="${line}" pathLength="1"/>${dots}<circle class="last" cx="${lp[0]}" cy="${lp[1]}" r="5"/>${lab}${xl}</svg>`;
  }
  const top=Object.entries(per).filter(([k])=>!String(k).startsWith('_')).map(([,v])=>v).sort((a,b)=>b.q-a.q).slice(0,5);
  const tq=Math.max(1,...top.map(x=>x.q));
  $('#topBox').innerHTML=top.length?top.map(x=>`<div class="topi"><div class="topl"><span>${esc(x.n)}</span><bdi>${fmtQ(x.q)}</bdi></div><div class="topbar"><i style="width:${Math.max(4,x.q/tq*100)}%"></i></div></div>`).join(''):`<div class="empty">${t('noSales')}</div>`;
}

/* Excel: export backup, template, import */
async function saveFile(filename,data){
  try{
    const blob=new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);toast(t('exported'),'ok');return true;
  }catch(e){toast(t('noDownload'),'err');return false}
}
async function loadAllMonths(n){
  const out=[];for(let i=0;i<n;i++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const m=monthOf(d);if(m===monthKey)continue;
    if(!(m in monthCache)){monthCache[m]=lsGet('shop.sales.'+m,[]);if(db&&base){try{const s=await db.doc(DP(base+'/sales-'+m)).get();if(s.exists)monthCache[m]=JSON.parse(JSON.stringify(s.data().list||[]))}catch(e){}}}}
}
$('#exportBtn').onclick=async()=>{

  add('Debts',customers.map(c=>({name:c.name,phone:c.phone||'',owes:Math.round(balanceOf(c)*100)/100})));
  add('Expenses',expenses.map(x=>({date:fmtDate(x.t),type:t('cat_'+x.cat),amount:x.a,note:x.note||''})));

$('#impFile').addEventListener('change',async e=>{

    if(typeof XLSX==='undefined')throw 0;
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false});

    let added=0,upd=0;
    rows.forEach(r=>{

      const cost=parseFloat(pick(r,['cartoncost','cost','بهایێکڕینێ','الكلفة']))||0;
      const price=parseFloat(pick(r,['price','بها','السعر']))||0;
      const cprice=parseFloat(pick(r,['cartonprice','جوملە','جملة']))||0;
      let expiry=pick(r,['expiry','بەسەرچوون','انتهاء']);expiry=/^\d{4}-\d{2}-\d{2}$/.test(String(expiry))?String(expiry):'';
      const ex=code?products.find(x=>x.barcode===code):products.find(x=>!x.barcode&&x.name===name);
      if(ex){ex.pieces+=cartons*Math.max(1,ex.perCarton|0);if(cost)ex.cartonCost=cost;if(price)ex.price=price;if(cprice)ex.cartonPrice=cprice;if(expiry)ex.expiry=expiry;upd++}
      else{products.push({id:uid(),name,barcode:code,perCarton:per,pieces:cartons*per,cartonCost:cost,price,cartonPrice:cprice,expiry,byWeight:false});added++}
    });
    saveProducts();renderAll();toast(t('imported').replace('{a}',added).replace('{u}',upd),'ok');
  }catch(err){console.warn(err);toast(t('importFail'),'err')}
});

function looksFake(n){
  if(/(\d)\1{5,}/.test(n))return true;
  if(new Set(n).size<=3)return true;
  const tail=n.slice(-7);
  return '01234567890123456789'.includes(tail)||'98765432109876543210'.includes(tail);
}
function parsePhone(raw,cc){
  const s=String(raw||'').replace(/[\s\-().]/g,'');if(!s)return null;
  let country=CC.find(c=>c.c===cc)||CC[0],nat;
  if(s.startsWith('+')||s.startsWith('00')){
    const d=s.replace(/^(\+|00)/,'');
    const m=CC.filter(c=>d.startsWith(c.d)).sort((a,b)=>b.d.length-a.d.length)[0];
    if(!m)return null;country=m;nat=d.slice(m.d.length);
  }else nat=s;
  if(!/^\d+$/.test(nat))return null;
  nat=nat.replace(/^0+/,'');
  if(nat.startsWith(country.d)&&country.n.includes(nat.length-country.d.length))nat=nat.slice(country.d.length);
  if(!country.n.includes(nat.length)||!country.s.test(nat)||looksFake(nat))return null;
  return '+'+country.d+nat;
}
function splitPhone(p){
  if(!p||!String(p).startsWith('+'))return {cc:'IQ',nat:p||''};
  const d=p.slice(1),m=CC.filter(c=>d.startsWith(c.d)).sort((a,b)=>b.d.length-a.d.length)[0];
  return m?{cc:m.c,nat:d.slice(m.d.length)}:{cc:'IQ',nat:p};
}

  const [u,dom]=e.split('@');
  if(u.length<2||/^(test|asdf|abc|fake|none|no|aa+|xx+|1+|123+)$/.test(u))return false;
  if(FAKE_DOMAINS.includes(dom))return false;
  if(/^(gmai|gmial|gamil|gmal|gnail|gmaill)\.com$|^(hotmial|hotmal|hotmai)\.com$|^(yaho|yahooo)\.com$/.test(dom))return false;
